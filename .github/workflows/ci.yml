name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: ['**']
  schedule:
    - cron: '17 4 * * 3'

permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
      - name: Verify lockfile is up-to-date
        run: uv lock --check --no-build

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [lockfile]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies without executing source builds
        run: uv sync --locked --no-build --no-install-project
      - name: Run tests
        run: uv run --no-sync pytest tests/ -v

  lint:
    name: Lint
    needs: [lockfile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
          python-version: '3.12'
      - run: uv sync --locked --no-build --no-install-project
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests

  typecheck:
    name: Type Check
    needs: [lockfile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
          python-version: '3.12'
      - run: uv sync --locked --no-build --no-install-project
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync ty check src

  security:
    name: Security
    needs: [lockfile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
          python-version: '3.12'
      - run: uv sync --locked --no-build --no-install-project
      - name: Scan source
        run: uv run --no-sync bandit -q -c pyproject.toml -r src
      - name: Audit all locked groups and extras
        run: |
          uv audit --locked --no-build

  package:
    name: Package
    needs: [lockfile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
          python-version: '3.12'
      - run: uv sync --locked --group build --no-build --no-install-project
      - name: Build with locked build dependencies
        run: uv build --no-build-isolation
      - name: Verify installed skill resources
        run: |
          uv venv .smoke
          uv pip install --python .smoke/bin/python --no-deps --no-build dist/*.whl
          .smoke/bin/python -m aws_test_plugin.cli init smoke-project --agent codebuddy --agent qoder --agent codex
          test -f smoke-project/.codebuddy/skills/aws-test-orchestrator/SKILL.md
          test -f smoke-project/.qoder/skills/aws-test-orchestrator/SKILL.md
          test -f smoke-project/.agents/skills/aws-test-orchestrator/SKILL.md
