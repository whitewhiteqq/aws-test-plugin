name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Verify release and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
          python-version: '3.12'
      - name: Verify annotated release tag and main ancestry
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          git merge-base --is-ancestor "refs/tags/${GITHUB_REF_NAME}^{}" origin/main
      - run: uv sync --locked --group build --no-build --no-install-project
      - name: Test and audit before release
        run: |
          uv run --no-sync pytest tests/ -v
          uv audit --locked --no-build
      - name: Build with locked build dependencies
        run: uv build --no-build-isolation
      - name: Smoke test the wheel
        run: |
          uv venv .smoke
          uv pip install --python .smoke/bin/python --no-deps --no-build dist/*.whl
          .smoke/bin/python -m aws_test_plugin.cli list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attest and publish
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aws-test-plugin
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
