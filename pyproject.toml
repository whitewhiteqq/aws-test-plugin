[project]
name = "aws-test-plugin"
version = "0.2.0"
description = "AWS Python test skills for Claude Code, Copilot, Codex, CodeBuddy, and Qoder"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "whitewhiteqq" },
]
keywords = [
    "aws", "testing", "lambda", "api-gateway", "step-functions", "batch",
    "claude", "copilot", "codex", "codebuddy", "qoder", "ai-agent", "skills", "plugin",
    "pytest", "moto", "locust", "e2e", "integration", "contract",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Minimal runtime deps for the CLI and safe report parsing
dependencies = [
    "defusedxml>=0.7.1",
]

[project.scripts]
aws-test-plugin = "aws_test_plugin.cli:main"

[project.optional-dependencies]
# Core test dependencies (most users want this)
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0",
    "moto[s3,dynamodb,sqs,sns,events,kinesis]>=5.2",
    "pyyaml>=6.0.3",
    "jsonschema>=4.25",
    "pydantic>=2.12",
]
# Unit testing extras (branch coverage)
unit = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0",
]
# Database integration testing
db = [
    "testcontainers[postgres]>=4.0",
    "psycopg2-binary>=2.9",
]
# Performance benchmarks
perf = [
    "pytest-benchmark>=4.0",
]
# Load testing
load = [
    "locust>=2.20",
]
# E2E testing against deployed APIs
e2e = [
    "requests>=2.33.0",
    "urllib3>=2.8.0",
]
# Reporting
report = [
    "pytest-html>=4.0",
    "allure-pytest>=2.13",
]
# Everything
all = [
    "aws-test-plugin[test,unit,db,perf,load,e2e,report]",
]
[project.urls]
Homepage = "https://github.com/whitewhiteqq/aws-test-plugin"
Repository = "https://github.com/whitewhiteqq/aws-test-plugin"
Issues = "https://github.com/whitewhiteqq/aws-test-plugin/issues"

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.13.10"
exclude-newer = "14 days"
preview-features = ["audit-command", "malware-check"]

[tool.uv.audit]
malware-check = true

[tool.hatch.build.targets.wheel]
packages = ["src/aws_test_plugin"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/skills", "/agents", "/.claude-plugin",
    "/tests/test_*.py", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock",
]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "aws_test_plugin/skills"
"agents" = "aws_test_plugin/agents"
".claude-plugin" = "aws_test_plugin/.claude-plugin"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
targets = ["src"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/**/*.py"]

[tool.ty.rules]
# Promoted to error once ty reaches feature parity with mypy
possibly-unresolved-reference = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests with moto/testcontainers",
    "contract: API contract validation tests",
    "e2e: End-to-end tests (requires deployed environment)",
    "performance: Performance benchmark tests",
    "load: Load/stress tests with Locust",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "ty>=0.0.10",
    "types-defusedxml",
    "bandit[toml]>=1.7.9",
]
build = ["hatchling>=1.29,<2"]
